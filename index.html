<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Portable course planning app for teachers with calendar scheduling, holiday tracking, and offline local data storage.">
    <meta name="theme-color" content="#4F46E5">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
    <title>CourseMap Planner</title>
    <style>
        :root {
            /* Light Theme & Modern Colors */
            --bg-body: #f8f9fa;
            --bg-card: #ffffff;
            --bg-hover: #f1f3f5;
            --primary: #4F46E5;
            /* Indigo-600 */
            --primary-hover: #4338ca;
            --text-main: #1f2937;
            /* Gray-800 */
            --text-muted: #6b7280;
            /* Gray-500 */
            --border: #e5e7eb;
            --danger: #ef4444;
            /* Red-500 */
            --success: #10b981;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-family);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Utilities */
        .hidden {
            display: none !important;
        }

        .flex {
            display: flex;
        }

        .flex-col {
            flex-direction: column;
        }

        .items-center {
            align-items: center;
        }

        .justify-between {
            justify-content: space-between;
        }

        .gap-2 {
            gap: 0.5rem;
        }

        .gap-4 {
            gap: 1rem;
        }

        .p-4 {
            padding: 1rem;
        }

        .p-2 {
            padding: 0.5rem;
        }

        .mb-1 {
            margin-bottom: 0.25rem;
        }

        .mb-2 {
            margin-bottom: 0.5rem;
        }

        .mb-4 {
            margin-bottom: 1rem;
        }

        .mt-4 {
            margin-top: 1rem;
        }

        .border {
            border: 1px solid var(--border);
        }

        .border-dashed {
            border-style: dashed;
        }

        .rounded {
            border-radius: var(--radius);
        }

        .block {
            display: block;
        }

        .w-20 {
            width: 5rem;
        }

        .w-full {
            width: 100%;
        }

        .h-8 {
            height: 2rem;
        }

        .flex-1 {
            flex: 1;
        }

        .overflow-y-auto {
            overflow-y: auto;
        }

        .text-xl {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .text-sm {
            font-size: 0.875rem;
        }

        .text-xs {
            font-size: 0.75rem;
        }

        .text-muted {
            color: var(--text-muted);
        }

        .font-bold {
            font-weight: 600;
        }

        /* Modern Button Styles */
        button {
            background: #fff;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            font-weight: 500;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover {
            background: var(--bg-hover);
            border-color: #d1d5db;
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        button:active {
            transform: translateY(0);
        }

        button.primary {
            background: var(--primary);
            color: white;
            border-color: transparent;
        }

        button.primary:hover {
            background: var(--primary-hover);
        }

        button.danger {
            color: var(--danger);
            border-color: #fee2e2;
            background: #fef2f2;
        }

        button.danger:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        button.icon-btn {
            padding: 0.25rem;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            border: none;
            box-shadow: none;
            background: transparent;
            color: var(--text-muted);
        }

        button.icon-btn:hover {
            background: #ffe4e6;
            /* light red bg */
            color: var(--danger);
            transform: scale(1.1);
        }

        .dashboard-title-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .dashboard-title-actions {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        button.dashboard-icon-btn {
            height: 32px;
            width: 32px;
            padding: 0;
            border-radius: 999px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            background: #fff;
            color: var(--text-muted);
            font-size: 1rem;
        }

        button.dashboard-icon-btn:hover {
            background: var(--bg-hover);
            color: var(--primary);
            border-color: #c7d2fe;
            transform: translateY(-1px);
        }

        button.dashboard-icon-btn.primary {
            background: var(--primary);
            color: white;
            border-color: transparent;
        }

        button.dashboard-icon-btn.primary:hover {
            background: var(--primary-hover);
            color: white;
            border-color: transparent;
        }

        input,
        select,
        textarea {
            background: #fff;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem;
            border-radius: var(--radius);
            font-size: 0.875rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* Scaffolding */
        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            z-index: 10;
        }

        main {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .view-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg-body);
        }

        /* Dashboard specific */
        #view-dashboard {
            padding: 2rem;
            overflow-y: auto;
        }

        /* Detail View specific */
        .detail-header {
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg-body);
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .detail-body {
            flex: 1;
            overflow: hidden;
            /* Prevent body scroll, let children scroll */
            padding: 1rem 2rem;
        }

        /* Dashboard */
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 1.5rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }

        .color-strip {
            height: 6px;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Detail View */
        .detail-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
            height: 100%;
            /* Fill available space */
        }

        /* Editor Column */
        .editor-panel {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow-y: auto;
            /* Independent Scroll */
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            height: 100%;
        }

        .unit-item {
            background: var(--bg-hover);
            padding: 6px;
            /* Reduced from 10px */
            border-radius: 4px;
            border: 1px solid var(--border);
            margin-bottom: 4px;
            /* Reduced from 8px */
        }

        .unit-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        /* Calendar Visualizer */
        .visualizer-panel {
            overflow-y: auto;
            /* Independent Scroll */
            position: relative;
            height: 100%;
            padding-right: 1rem;
            /* Avoid scrollbar overlay issues */
        }

        .calendar-warnings {
            background: rgba(207, 102, 121, 0.2);
            border: 1px solid var(--danger);
            color: #ffcccc;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        .month-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .month-card {
            background: var(--bg-card);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .month-header {
            background: var(--bg-hover);
            padding: 0.5rem;
            text-align: center;
            font-weight: bold;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 0.8rem;
        }

        .day-header {
            padding: 4px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        .day-cell {
            padding: 4px;
            height: 70px;
            /* Fixed height */
            border-bottom: 1px solid var(--border);
            border-right: 1px solid var(--border);
            position: relative;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .day-cell.empty {
            background: transparent;
            cursor: default;
            border: none;
        }

        .day-cell:hover:not(.empty) {
            background-color: var(--bg-hover);
        }

        .day-number {
            font-weight: 600;
            margin-bottom: 2px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .day-info {
            font-size: 0.7rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
            line-height: 1.2;
            font-weight: 500;
        }

        .session-count {
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 0.65rem;
            background: rgba(0, 0, 0, 0.1);
            color: var(--text-main);
            padding: 1px 4px;
            border-radius: 4px;
            pointer-events: none;
        }

        /* Print styles */
        @media print {
            body {
                background: white;
                color: black;
                overflow: visible;
                height: auto;
                display: block;
            }

            header,
            .editor-panel,
            button {
                display: none !important;
            }

            .detail-layout {
                display: block;
            }

            .visualizer-panel {
                overflow: visible;
                box-shadow: none;
                background: white;
            }

            .month-card {
                border: 1px solid #ccc;
                break-inside: avoid;
                margin-bottom: 1rem;
                box-shadow: none;
            }

            .day-cell {
                border-color: #eee;
            }
        }

        /* Holiday Mode */
        .holiday-mode .day-cell {
            cursor: pointer;
        }

        .holiday-mode .day-cell:hover {
            opacity: 0.8;
            background: var(--primary) !important;
            color: white;
        }

        .day-cell.weekend {
            background: #f3f4f6;
            /* Gray-100 */
            color: #9ca3af;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(3px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 420px;
            box-shadow: var(--shadow-lg);
            transform: scale(0.95) translateY(10px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .modal-overlay.open .modal-box {
            transform: scale(1) translateY(0);
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .modal-msg {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }
    </style>

</head>

<body>

    <!-- Header Removed by User Request -->

    <main>
        <!-- DASHBOARD VIEW -->
        <div id="view-dashboard" class="view-container">
            <div class="flex justify-between items-center">
                <div class="dashboard-title-row">
                    <h2 data-i18n="dashboard.title">Mis Asignaturas</h2>
                    <div class="dashboard-title-actions">
                        <button class="dashboard-icon-btn" onclick="app.importSubject()" data-i18n-vals="title:dashboard.import;aria-label:dashboard.import">↑</button>
                        <input type="file" id="file-import" class="hidden" accept=".json"
                            onchange="app.handleFileSelect(this)">

                <div class="flex gap-2 items-center">

                </div>
            </div>

            <div id="subjects-list" class="subject-grid">
                <!-- Cards injected here -->
            </div>
        </div>

        <!-- SUBJECT DETAIL VIEW -->
        <!-- SUBJECT DETAIL VIEW -->
        <!-- SUBJECT DETAIL VIEW -->
        <div id="view-detail" class="view-container hidden">
            <div class="detail-header">
                <div class="flex items-center gap-4">
                    <button onclick="app.navigateTo('dashboard')" data-i18n="detail.back">← Volver</button>
                    <h2 id="detail-subject-name">Matemáticas</h2>
                </div>
                <div class="flex gap-2">
                    <button onclick="app.openHelp()" data-i18n="detail.help">Ayuda</button>
                    <button id="btn-install-detail" class="primary" onclick="app.installApp()"

                    <button onclick="app.printSummary()" data-i18n="detail.summary">🖨️ Resumen</button>
                    <button id="btn-holiday-mode" onclick="app.toggleHolidayMode()" data-i18n="detail.holidays_edit">✏️
                        Festivos</button>
                    <button onclick="app.exportHolidays()" data-i18n="detail.holidays_export">⬇️ Festivos</button>
                    <button onclick="app.importHolidays()" data-i18n="detail.holidays_import">⬆️ Festivos</button>
                    <input type="file" id="import-holidays-file" class="hidden" accept=".json"
                        onchange="app.handleHolidayImport(this)">
                </div>
            </div>

            <div class="detail-body">
                <div class="detail-layout">
                    <!-- LEFT: EDITOR -->
                    <div class="editor-panel">
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <h4 class="text-muted" data-i18n="detail.config">Configuración</h4>
                                <button class="danger text-xs" onclick="app.deleteCurrentSubject()"
                                    data-i18n="detail.delete">🗑️
                                    Eliminar</button>
                            </div>
                            <div class="flex flex-col gap-2">
                                <label class="text-xs text-muted"><span data-i18n="detail.name">Nombre</span>
                                    <input id="edit-name" type="text" class="w-full" oninput="app.saveCurrentSubject()">
                                </label>
                                <label class="text-xs text-muted"><span data-i18n="detail.start_date">Fecha Inicio

                                <label class="text-xs text-muted"><span data-i18n="detail.mode">Modo

                        <!-- Weekly Schedule -->

                            <div class="flex flex-col gap-2">
                                <div class="flex items-center justify-between">

                                <div class="flex items-center justify-between">
                                    <label class="w-20 text-sm" data-i18n="detail.days.tue">Martes</label>
                                    <input type="number" id="sch-2" min="0" max="10" class="flex-1" value="0"

                                </div>
                                <div class="flex items-center justify-between">
                                    <label class="w-20 text-sm" data-i18n="detail.days.wed">Miércoles</label>
                                    <input type="number" id="sch-3" min="0" max="10" class="flex-1" value="0"

                                </div>
                                <div class="flex items-center justify-between">
                                    <label class="w-20 text-sm" data-i18n="detail.days.thu">Jueves</label>
                                    <input type="number" id="sch-4" min="0" max="10" class="flex-1" value="0"

                                </div>
                                <div class="flex items-center justify-between">
                                    <label class="w-20 text-sm" data-i18n="detail.days.fri">Viernes</label>
                                    <input type="number" id="sch-5" min="0" max="10" class="flex-1" value="0"

                            </div>
                        </div>

                        <!-- Units -->
                        <div class="flex-1 flex flex-col">
                            <div class="flex justify-between items-center mb-2">
                                <h4 class="text-muted" data-i18n="detail.units_title">Unidades Didácticas</h4>
                                <!-- Add button removed from here -->
                            </div>
                            <div id="units-list" class="flex-1">
                                <!-- Unit items injected here -->
                            </div>
                            <!-- Add button moved here -->
                            <button class="text-sm primary w-full mt-4" onclick="app.addUnit()"

                    <!-- RIGHT: VISUALIZER -->
                    <div class="visualizer-panel">

    </main>

    <!-- MODAL OVERLAY -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modal-title" class="modal-title">Título</h3>
            <p id="modal-msg" class="modal-msg">Mensaje...</p>
            <div class="modal-actions">
                <button id="modal-cancel" data-i18n="modal.cancel">Cancelar</button>
                <button id="modal-confirm" class="primary" data-i18n="modal.confirm">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="locales.js"></script>
    <script src="i18n.js"></script>

    <script>
        /**
         * APPLICATION LOGIC
         */
        const AppState = {
            data: {
                subjects: []
            },
            currentSubjectId: null,
            holidayMode: false,
            deferredInstallPrompt: null
        };

        const Utils = {
            uuid: () => Date.now().toString(36) + Math.random().toString(36).substr(2),
            // Use local date parts to avoid timezone shifts
            formatDate: (d) => {
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            },
            // Parse YYYY-MM-DD to Local Date 00:00
            parseDate: (str) => {
                const [y, m, d] = str.split('-').map(Number);
                return new Date(y, m - 1, d);
            },
            addDays: (d, days) => { const result = new Date(d); result.setDate(result.getDate() + days); return result; },
            getContrastColor: (hex) => {
                const r = parseInt(hex.substr(1, 2), 16);
                const g = parseInt(hex.substr(3, 2), 16);
                const b = parseInt(hex.substr(5, 2), 16);
                const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
                return (yiq >= 128) ? 'black' : 'white';
            }
        };

        const app = {
            /* --- MODAL SYSTEM --- */
            showModal: (title, msg, isConfirm, onYes, onNo) => {
                const ol = document.getElementById('modal-overlay');
                const t = document.getElementById('modal-title');
                const m = document.getElementById('modal-msg');
                const bYes = document.getElementById('modal-confirm');
                const bNo = document.getElementById('modal-cancel');

                t.innerText = title;
                m.innerText = msg;
                ol.classList.add('open');

                bYes.innerText = isConfirm ? 'Confirmar' : 'Aceptar';
                bNo.style.display = isConfirm ? 'inline-flex' : 'none';

                // Reset Listeners
                const nYes = bYes.cloneNode(true);
                const nNo = bNo.cloneNode(true);
                bYes.parentNode.replaceChild(nYes, bYes);
                bNo.parentNode.replaceChild(nNo, bNo);

                nYes.onclick = () => { ol.classList.remove('open'); if (onYes) onYes(); };

            /* --- CALCULATOR CORE (WATERFALL) --- */
            getSchedulableItems: (subject) => {
                const mode = subject.planningMode || 'unit';

                // Enforce names in data to match the visual "Fixed" sequence just in case
                subject.units.forEach((u, idx) => { u.name = `UD ${idx + 1}`; });

                if (mode === 'unit') {
                    return subject.units.map((u, idx) => ({
                        ...u,
                        totalSessions: (u.base || 0) + (u.extra || 0),
                        type: 'unit',
                        unitIndex: idx,
                        hue: (parseInt(subject.color.replace('#', ''), 16) + (idx * 137)) % 360,
                        displayName: u.name
                    }));
                } else {
                    // Activity Mode
                    const items = [];
                    let globalActIndex = 0; // GLOBAL counter

                    subject.units.forEach((u, idx) => {
                        const unitHue = (parseInt(subject.color.replace('#', ''), 16) + (idx * 137)) % 360;

                        if (u.activities && u.activities.length > 0) {
                            u.activities.forEach((a, actIdx) => {
                                const actName = `Act ${idx + 1}.${actIdx + 1}`;
                                a.name = actName;

                                // GLOBAL SHIFT: Ensure strictly sequential distinctness
                                // We use the Unit Hue as a base but drive the shift primarily by the sequence
                                const actHue = (unitHue + (globalActIndex * 137) + 50) % 360;
                                globalActIndex++;

                                items.push({
                                    ...a,
                                    totalSessions: (parseInt(a.sessions) || 0) + (parseInt(a.extra) || 0),
                                    type: 'activity',
                                    unitIndex: idx,
                                    parentUnitId: u.id,
                                    parentUnitName: `UD ${idx + 1}`,
                                    unitHue: unitHue, // Pass Unit Hue for "Top" part
                                    hue: actHue, // Pass Act Hue for "Bottom" part
                                    displayName: actName
                                });
                            });
                        }
                    });
                    return items;
                }
            },

            calculateCalendar: (subject) => {
                const localHolidays = new Set(subject.localHolidays || []);
                let currentDate = Utils.parseDate(subject.startDate);

                let endYear = currentDate.getFullYear();
                if (currentDate.getMonth() >= 6) { endYear++; }
                const limitDate = new Date(endYear, 5, 30);

                const scheduleMap = new Map();
                const unitRanges = {};
                const activityRanges = {};

                // Use flattened items list
                const items = app.getSchedulableItems(subject);
                let itemIndex = 0;
                let sessionsDoneInItem = 0;

                while (currentDate <= limitDate && itemIndex < items.length) {
                    const dateStr = Utils.formatDate(currentDate);
                    const dayOfWeek = currentDate.getDay();

                    if (dayOfWeek === 0 || dayOfWeek === 6) {
                        currentDate = Utils.addDays(currentDate, 1);
                        continue;
                    }

                    if (localHolidays.has(dateStr)) {
                        scheduleMap.set(dateStr, { type: 'holiday' });
                        currentDate = Utils.addDays(currentDate, 1);
                        continue;
                    }

                    // Get sessions available today
                    let dailyCapacity = subject.schedule[dayOfWeek];
                    if (dailyCapacity === true) dailyCapacity = 1;
                    if (!dailyCapacity || dailyCapacity <= 0) {
                        currentDate = Utils.addDays(currentDate, 1);
                        continue;
                    }

                    const allocations = [];
                    let slotsUsed = 0;

                    // Fill the day slot by slot
                    while (slotsUsed < dailyCapacity && itemIndex < items.length) {
                        const currentItem = items[itemIndex];
                        const totalSessions = currentItem.totalSessions;

                        // Track Unit Range
                        const unitId = (currentItem.type === 'activity' || currentItem.type === 'extra') ? currentItem.parentUnitId : currentItem.id;

                        if (!unitRanges[unitId]) {
                            unitRanges[unitId] = { start: dateStr, end: dateStr };
                        }
                        unitRanges[unitId].end = dateStr;

                        // Track Activity Range
                        if (currentItem.type === 'activity') {
                            if (!activityRanges[currentItem.id]) {
                                activityRanges[currentItem.id] = { start: dateStr, end: dateStr };
                            }
                            activityRanges[currentItem.id].end = dateStr;
                        } else if (currentItem.type === 'extra') {
                            // Track extra block as well if needed, ID is unitId + '_extra'
                            if (!activityRanges[currentItem.id]) {
                                activityRanges[currentItem.id] = { start: dateStr, end: dateStr };
                            }
                            activityRanges[currentItem.id].end = dateStr;
                        }

                        const remainingInItem = totalSessions - sessionsDoneInItem;
                        const remainingToday = dailyCapacity - slotsUsed;

                        const take = Math.min(remainingToday, remainingInItem);

                        if (take > 0) {
                            allocations.push({
                                item: currentItem, // Changed from 'unit' to 'item'
                                sessions: take
                            });

                            slotsUsed += take;
                            sessionsDoneInItem += take;

                            if (sessionsDoneInItem >= totalSessions) {
                                itemIndex++;
                                sessionsDoneInItem = 0;
                            }
                        } else {
                            if (remainingInItem <= 0) {
                                // Should not happen if loop condition is correct, but safe guard
                                itemIndex++;
                                sessionsDoneInItem = 0;
                            } else {
                                break;
                            }
                        }
                    }

                    if (allocations.length > 0) {
                        scheduleMap.set(dateStr, { type: 'class', allocations: allocations, totalOrigin: dailyCapacity });
                    }

                    currentDate = Utils.addDays(currentDate, 1);
                }

                return { scheduleMap, finished: itemIndex >= items.length, lastDate: currentDate, unitRanges, activityRanges };
            },

            renderCalendar: (subject) => {
                const { scheduleMap, finished, lastDate, activityRanges } = app.calculateCalendar(subject);
                const grid = document.getElementById('calendar-grid');
                grid.innerHTML = '';

                if (AppState.holidayMode) grid.classList.add('holiday-mode');
                else grid.classList.remove('holiday-mode');

                const alerts = document.getElementById('calendar-alerts');
                if (!finished) {
                    alerts.innerHTML = `⚠️ <b>${I18n.t('modal.warning')}:</b> ${I18n.t('modal.warning_cut')}: ${Utils.formatDate(lastDate)}`;
                    alerts.classList.remove('hidden');
                } else {
                    alerts.classList.add('hidden');
                }

                const startObj = Utils.parseDate(subject.startDate);
                let renderYear = startObj.getFullYear();
                if (startObj.getMonth() < 6) renderYear--;

                let renderDate = new Date(renderYear, 8, 1);

                for (let i = 0; i < 10; i++) {
                    const monthCard = document.createElement('div');
                    monthCard.className = 'month-card';

                    const mIndex = renderDate.getMonth();
                    const yearVal = renderDate.getFullYear();
                    const monthNames = I18n.t('calendar.months');
                    const monthName = monthNames && monthNames[mIndex] ? monthNames[mIndex] : renderDate.toLocaleString(I18n.currentLang, { month: 'long' });

                    let html = `<div class="month-header">${monthName.toUpperCase()} ${yearVal}</div>`;
                    const daysShort = I18n.t('detail.days_short');
                    html += `<div class="days-grid">
                        <div class="day-header">${daysShort[0]}</div><div class="day-header">${daysShort[1]}</div><div class="day-header">${daysShort[2]}</div>
                        <div class="day-header">${daysShort[3]}</div><div class="day-header">${daysShort[4]}</div><div class="day-header">${daysShort[5]}</div>
                        <div class="day-header">${daysShort[6]}</div>`;

                    let dayOfWeek = renderDate.getDay();
                    if (dayOfWeek === 0) dayOfWeek = 7;
                    for (let k = 1; k < dayOfWeek; k++) html += `<div class="day-cell empty"></div>`;

                    const currentMonth = renderDate.getMonth();
                    let d = new Date(renderDate);

                    while (d.getMonth() === currentMonth) {
                        const dateStr = Utils.formatDate(d);
                        const item = scheduleMap.get(dateStr);
                        let isWeekend = (d.getDay() === 0 || d.getDay() === 6);

                        let cellStyle = '';
                        let cellTitle = '';
                        let cellContent = `<span class="day-number">${d.getDate()}</span>`;
                        let className = 'day-cell';
                        if (isWeekend) className += ' weekend';

                        if (item) {
                            if (item.type === 'holiday') {
                                cellStyle = 'background: rgba(0,0,0,0.05); color: #666; border: 1px dashed #ccc;';
                                cellContent += `<div class="day-info">${I18n.t('calendar.holiday')}</div>`;
                            } else if (item.type === 'class') {

                                // --- SPLIT VIEW LOGIC FOR ACTIVITY MODE ---
                                const isActivityMode = (subject.planningMode === 'activity');

                                if (isActivityMode) {
                                    // 1. Top Half: Unit Color + Name (Multi-unit support)
                                    const unitsMap = new Map();
                                    let totalUnitsSessions = 0;
                                    item.allocations.forEach(alloc => {
                                        const uId = alloc.item.parentUnitId;
                                        if (uId) {
                                            totalUnitsSessions += alloc.sessions;
                                            if (!unitsMap.has(uId)) {
                                                unitsMap.set(uId, {
                                                    name: alloc.item.parentUnitName,
                                                    hue: alloc.item.unitHue || 0,
                                                    sessions: 0
                                                });
                                            }
                                            unitsMap.get(uId).sessions += alloc.sessions;
                                        }
                                    });

                                    const uniqueUnits = Array.from(unitsMap.values());
                                    let unitColor = '';
                                    let unitLabel = '';

                                    if (uniqueUnits.length === 0) {
                                        // Fallback just in case
                                        unitColor = '#eee';
                                        unitLabel = '-';
                                    } else {
                                        // Standardize Logic: Always use gradient to support "Partial Fill" visualization
                                        let stops = [];
                                        let currentPct = 0;

                                        // Use totalOrigin (Day Capacity) as denominator, not just allocations sum
                                        const denominator = item.totalOrigin || 1;

                                        uniqueUnits.forEach(u => {
                                            const share = (u.sessions / denominator) * 100;
                                            const c = `hsl(${u.hue}, 60%, 75%)`;
                                            stops.push(`${c} ${currentPct}%`);
                                            stops.push(`${c} ${currentPct + share}%`);
                                            currentPct += share;
                                        });

                                        // If not full, add transparency
                                        if (currentPct < 100) {
                                            stops.push(`rgba(0,0,0,0.05) ${currentPct}%`);
                                            stops.push(`rgba(0,0,0,0.05) 100%`);
                                        }

                                        unitColor = `linear-gradient(to right, ${stops.join(', ')})`;
                                        unitLabel = uniqueUnits.map(u => u.name).join(' + ');
                                    }

                                    // Make label truncating
                                    const unitLabelStyle = `background:${unitColor}; color:#333; font-size:0.6rem; font-weight:bold; padding:2px; padding-left:4px; height: 40%; display:flex; align-items:center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;`;

                                    // 2. Bottom Half: Gradient of Activities
                                    let gradientStops = [];
                                    let currentPercent = 0;
                                    let labels = [];

                                    item.allocations.forEach(alloc => {
                                        const actHue = alloc.item.hue || 0;
                                        const color = `hsl(${actHue}, 70%, 60%)`; // Vivid for bottom
                                        const percentShare = (alloc.sessions / item.totalOrigin) * 100;

                                        gradientStops.push(`${color} ${currentPercent}%`);
                                        gradientStops.push(`${color} ${currentPercent + percentShare}%`);
                                        currentPercent += percentShare;
                                        labels.push(alloc.item.displayName);
                                    });
                                    if (currentPercent < 100) {
                                        gradientStops.push(`transparent ${currentPercent}%`);
                                        gradientStops.push(`transparent 100%`);
                                    }
                                    const bottomBg = gradientStops.length > 0 ? `linear-gradient(to right, ${gradientStops.join(', ')})` : 'transparent';

                                    // Construct SPLIT CELL
                                    cellStyle = `padding:0; display:flex; flex-direction:column; position:relative; overflow:hidden;`;

                                    // Make date number always legible on top right
                                    const dateBadge = `<span style="position:absolute; top:2px; right:2px; z-index:5; background:rgba(255,255,255,0.8); border-radius:4px; padding:0 2px; font-size:0.7rem; font-weight:bold; color:#333; pointer-events:none;">${d.getDate()}</span>`;

                                    // Session count badge for Activity Mode
                                    const countBadge = `<span class="session-count" style="color: white; background: rgba(0,0,0,0.3); z-index:5;">${item.totalOrigin} ${I18n.t('calendar.sessions')}</span>`;

                                    cellContent = `
                                        ${dateBadge}
                                        <div style="${unitLabelStyle}" title="${unitLabel}">
                                            ${unitLabel}
                                        </div>
                                        <div style="background:${bottomBg}; flex:1; padding:2px; padding-top:4px; font-size:0.65rem; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.5); font-weight:500; display:flex; align-items:flex-start; line-height:1;">
                                            ${labels.join('+')}
                                        </div>
                                        ${countBadge}
                                    `;

                                } else {
                                    // --- STANDARD (UNIT) MODE ---
                                    let gradientStops = [];
                                    let currentPercent = 0;
                                    let labels = [];

                                    item.allocations.forEach(alloc => {
                                        const hue = alloc.item.hue || 0;
                                        const color = `hsl(${hue}, 60%, 65%)`;

                                        const percentShare = (alloc.sessions / item.totalOrigin) * 100;

                                        gradientStops.push(`${color} ${currentPercent}%`);
                                        gradientStops.push(`${color} ${currentPercent + percentShare}%`);

                                        currentPercent += percentShare;

                                        labels.push(alloc.item.displayName);
                                    });

                                    // Fill remainder with transparent if day is not full
                                    if (currentPercent < 100) {
                                        gradientStops.push(`rgba(0,0,0,0.05) ${currentPercent}%`);
                                        gradientStops.push(`rgba(0,0,0,0.05) 100%`);
                                    }

                                    const bg = gradientStops.length > 0 ? `linear-gradient(to right, ${gradientStops.join(', ')})` : 'transparent';
                                    cellStyle = `background: ${bg}; color: #111;`;
                                    cellTitle = item.allocations.map(a => `${a.item.displayName} (${a.sessions} ses)`).join(', ');

                                    cellContent += `<div class="day-info">${labels.join('+')}</div>`;
                                    // Show Session Count
                                    cellContent += `<span class="session-count">${item.totalOrigin} ses.</span>`;
                                }
                            }
                        }

                        // Check raw local array for holidays on weekends/skipped days
                        const isLocal = (subject.localHolidays || []).includes(dateStr);
                        if (isLocal && !item) {
                            cellStyle = 'background: rgba(0,0,0,0.05); color: #666; border: 1px dashed #ccc;';
                            cellContent += '<div class="day-info">Festivo</div>';
                        }

                        html += `<div class="${className}" style="${cellStyle}" title="${cellTitle}" onclick="app.clickDay('${dateStr}')">${cellContent}</div>`;
                        d.setDate(d.getDate() + 1);
                    }

                    html += `</div>`;
                    monthCard.innerHTML = html;
                    grid.appendChild(monthCard);

                    renderDate.setMonth(renderDate.getMonth() + 1);
                }
            },

            exportCurrentSubject: () => {
                const sub = AppState.data.subjects.find(s => s.id === AppState.currentSubjectId);
                if (!sub) return;

                const dataStr = JSON.stringify(sub, null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const nav = document.createElement('a');
                nav.href = url;
                nav.download = `${sub.name.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_planner.json`;
                nav.click();
            },

            printSummary: () => {
                const sub = AppState.data.subjects.find(s => s.id === AppState.currentSubjectId);
                if (!sub) return;

                const { unitRanges, activityRanges } = app.calculateCalendar(sub);
                const mode = sub.planningMode || 'unit';
                const totalSes = sub.units.reduce((acc, u) => {
                    let uTotal = 0;
                    if (mode === 'unit') uTotal = (parseInt(u.base) || 0) + (parseInt(u.extra) || 0);
                    else uTotal = (u.activities || []).reduce((s, a) => s + (parseInt(a.sessions) || 0) + (parseInt(a.extra) || 0), 0);
                    return acc + uTotal;
                }, 0);

                const fmt = (dStr) => {
                    if (!dStr) return '-';
                    const [y, m, d] = dStr.split('-');
                    return `${d}/${m}`;
                };

                let rows = '';

                sub.units.forEach((u, idx) => {
                    let uBase = 0;
                    let uExtra = 0;

                    if (mode === 'unit') {
                        uBase = parseInt(u.base) || 0;
                        uExtra = parseInt(u.extra) || 0;
                    } else {
                        // Activity Mode: Aggregate from activities
                        uBase = (u.activities || []).reduce((s, a) => s + (parseInt(a.sessions) || 0), 0);
                        uExtra = (u.activities || []).reduce((s, a) => s + (parseInt(a.extra) || 0), 0);
                    }
                    const uTotal = uBase + uExtra;

                    const range = unitRanges && unitRanges[u.id];
                    const dateStr = range ? `${fmt(range.start)} - ${fmt(range.end)}` : I18n.t('detail.no_schedule');

                    const unitClass = mode === 'activity' ? 'unit-row shaded' : 'unit-row';

                    // Unit Row
                    rows += `
                        <tr class="${unitClass}">
                            <td>
                                <div class="unit-title">${u.name || (I18n.t('detail.default_unit_name') + ' ' + (idx + 1))}</div>
                            </td>
                            <td class="text-center"><strong style="font-size: 1.1em">${uTotal}</strong></td>
                            <td class="text-center text-muted">${uBase}</td>
                            <td class="text-center text-muted">${uExtra}</td>
                            <td class="date-col text-right">${dateStr}</td>
                        </tr>
                    `;

                    // Activity Rows
                    if (mode === 'activity' && u.activities) {
                        u.activities.forEach((act, aIdx) => {
                            const aBase = parseInt(act.sessions) || 0;
                            const aExtra = parseInt(act.extra) || 0;
                            const aTotal = aBase + aExtra;

                            const aRange = activityRanges && activityRanges[act.id];
                            const aDateStr = aRange ? `${fmt(aRange.start)} - ${fmt(aRange.end)}` : '-';

                            rows += `
                                <tr class="act-row">
                                    <td class="act-name">
                                        ${act.name || (I18n.t('detail.add_activity') + ' ' + (aIdx + 1))}
                                    </td>
                                    <td class="text-center"><strong>${aTotal}</strong></td>
                                    <td class="text-center text-muted">${aBase}</td>
                                    <td class="text-center text-muted">${aExtra}</td>
                                    <td class="date-col text-right">${aDateStr}</td>
                                </tr>
                            `;
                        });
                    }
                });

                const html = `
                    <!DOCTYPE html>
                    <html lang="${I18n.currentLang}">
                    <head>
                        <title>${I18n.t('summary.title')} - ${sub.name}</title>
                        <style>
                            :root { font-family: 'Segoe UI', system-ui, sans-serif; }
                            body { padding: 3rem; color: #111; max-width: 900px; margin: 0 auto; }
                            h1 { color: ${sub.color || '#000'}; border-bottom: 3px solid ${sub.color || '#000'}; padding-bottom: 0.5rem; margin-bottom: 0.5rem; }
                            .meta { margin-bottom: 2rem; color: #555; display: flex; gap: 2rem; font-size: 0.95rem; background: #f9f9f9; padding: 1rem; border-radius: 8px; }
                            
                            table { width: 100%; border-collapse: collapse; margin-top: 1rem; table-layout: fixed; }
                            th { text-align: left; border-bottom: 2px solid #ccc; padding: 0.8rem; font-size: 0.85rem; text-transform: uppercase; color: #555; }
                            td { border-bottom: 1px solid #eee; padding: 0.6rem 0.8rem; vertical-align: middle; }
                            
                            .unit-row { background: #fff; }
                            .unit-row.shaded { background: #f3f4f6; -webkit-print-color-adjust: exact; print-color-adjust: exact; } /* Gray-100 */
                            .unit-row td { padding-top: 1rem; padding-bottom: 1rem; border-bottom: 1px solid #ddd; }
                            .unit-title { font-weight: 700; font-size: 1.1rem; color: #000; }
                            
                            .act-row td { padding-top: 0.4rem; padding-bottom: 0.4rem; border-bottom: 1px dashed #eee; font-size: 0.9rem; }
                            .act-name { padding-left: 2rem !important; position: relative; color: #444; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
                            .act-name::before { content: '↳'; position: absolute; left: 0.8rem; color: #ccc; }
                            
                            .date-col { white-space: nowrap; font-family: 'Consolas', monospace; color: #444; font-size: 0.9rem; }
                            .text-muted { color: #999; }
                            .text-center { text-align: center; }
                            .text-right { text-align: right; }
                            
                            @media print {
                                body { padding: 0; }
                                .no-print { display: none; }
                                .unit-row.shaded { background: #f3f4f6 !important; }
                            }
                        </style>
                    </head>
                    <body>
                        <h1>${sub.name}</h1>
                        <div class="meta">
                            <div><strong>${I18n.t('dashboard.start')}:</strong> ${sub.startDate}</div>
                            <div><strong>${I18n.t('summary.mode')}:</strong> ${mode === 'unit' ? I18n.t('summary.unit') : I18n.t('summary.activity')}</div>
                            <div><strong>${I18n.t('summary.total_course')}:</strong> ${totalSes} ${I18n.t('summary.sessions')}</div>
                        </div>
                        
                        <table>
                            <thead>
                                <tr>
                                    <th>${I18n.t('summary.unit_activity')}</th>
                                    <th width="60" class="text-center">${I18n.t('detail.total')}</th>
                                    <th width="60" class="text-center">${I18n.t('detail.base_short')}</th>
                                    <th width="60" class="text-center">${I18n.t('detail.extra_short')}</th>
                                    <th width="140" class="text-right">${I18n.t('summary.dates')}</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rows}
                            </tbody>
                        </table>
                        
                        <script>
                            setTimeout(() => window.print(), 500);
                        <\/script>
                    </body>
                    </html>
                `;

                const win = window.open('', '_blank');
                win.document.write(html);
                win.document.close();
            },

            importSubject: () => {
                document.getElementById('file-import').click();
            },

            handleFileSelect: (input) => {
                const file = input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const json = JSON.parse(e.target.result);

                        if (!json.id || !json.units) {
                            app.showAlert('Error', 'El archivo no parece ser una asignatura válida (faltan campos obligatorios).');
                            return;
                        }

                        // Check for name collision
                        let newName = json.name;
                        let counter = 1;
                        while (AppState.data.subjects.some(s => s.name === newName)) {
                            newName = `${json.name} (Copia ${counter})`;
                            counter++;
                        }
                        json.name = newName;

                        // Always generate new ID to avoid internal collisions, but keep structure
                        json.id = Utils.uuid();

                        AppState.data.subjects.push(json);
                        app.saveToStorage();
                        app.renderDashboard();
                        app.showAlert('Importación Exitosa', `La asignatura se ha importado como "${json.name}".`);
                    } catch (err) {
                        app.showAlert('Error', 'No se pudo leer el archivo JSON. Verifica el formato.');
                    }
                };
                reader.readAsText(file);
                input.value = '';
            }
        };

        app.init();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(error => {
                    console.error('Service worker registration failed:', error);
                });
            });
        }

    </script>
</body>

</html>
