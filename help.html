<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4F46E5">
    <title>Ayuda | CourseMap Planner</title>
    <style>
        :root { --bg:#f5f7fb; --panel:#fff; --text:#1f2937; --muted:#6b7280; --primary:#4F46E5; --primary-soft:#e0e7ff; --border:#e5e7eb; --shadow:0 10px 25px rgba(15,23,42,.08); --radius:18px; --max-width:980px; --font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
        * { box-sizing:border-box; }
        body { margin:0; font-family:var(--font-family); color:var(--text); background:radial-gradient(circle at top left, rgba(79,70,229,.12), transparent 32%), linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%); }
        main { width:min(var(--max-width), calc(100% - 32px)); margin:0 auto; padding:32px 0 56px; }
        .hero, .card { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
        .hero { padding:28px; margin-bottom:20px; }
        .hero-top { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
        .badge { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; background:var(--primary-soft); color:var(--primary); border-radius:999px; font-size:.9rem; font-weight:700; }
        h1 { margin:0 0 12px; font-size:clamp(2rem, 4vw, 3rem); line-height:1.05; }
        .lead { margin:0; color:var(--muted); font-size:1.05rem; max-width:70ch; line-height:1.7; }
        .toolbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
        select, .button-link { border:1px solid var(--border); border-radius:12px; background:#fff; color:var(--text); padding:10px 14px; font:inherit; text-decoration:none; }
        .button-link { background:var(--primary); color:#fff; border-color:var(--primary); font-weight:600; }
        .grid { display:grid; gap:16px; }
        .card { padding:24px; }
        h2 { margin:0 0 12px; font-size:1.35rem; }
        p, li { line-height:1.7; color:var(--text); }
        ul, ol { margin:0; padding-left:20px; }
        .muted { color:var(--muted); }
        .two-columns { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px; }
        .callout { padding:16px; border-radius:14px; background:#f9fafb; border:1px solid var(--border); }
        @media (max-width:760px) { main { width:min(var(--max-width), calc(100% - 20px)); padding-top:20px; } .hero, .card { padding:18px; } .two-columns { grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <main>
        <section class="hero">
            <div class="hero-top">
                <div class="badge" id="hero-badge">Ayuda</div>
                <div class="toolbar">
                    <label for="lang-picker" class="muted" id="lang-label">Idioma</label>
                    <select id="lang-picker" aria-labelledby="lang-label">
                        <option value="es">Español</option>
                        <option value="gl">Galego</option>
                        <option value="ca">Català</option>
                        <option value="eu">Euskara</option>
                        <option value="en">English</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="pt">Português</option>
                    </select>
                    <a class="button-link" href="./index.html" id="open-app-link">Abrir aplicación</a>
                </div>
            </div>
            <h1 id="hero-title">Ayuda de CourseMap Planner</h1>
            <p class="lead" id="hero-lead"></p>
        </section>
        <div class="grid">
            <section class="card"><h2 id="quick-start-title"></h2><ol id="quick-start-list"></ol></section>
            <div class="two-columns">
                <section class="card">
                    <h2 id="planning-title"></h2><p id="planning-intro"></p>
                    <div class="callout"><strong id="planning-unit-title"></strong><p id="planning-unit-body"></p></div>
                    <div class="callout" style="margin-top:12px;"><strong id="planning-activity-title"></strong><p id="planning-activity-body"></p></div>
                </section>
                <section class="card">
                    <h2 id="holidays-title"></h2><p id="holidays-body"></p>
                    <h2 style="margin-top:20px;" id="data-title"></h2><p id="data-body"></p>
                </section>
            </div>
            <section class="card"><h2 id="actions-title"></h2><ul id="actions-list"></ul></section>
            <section class="card"><h2 id="install-title"></h2><p id="install-body"></p><ul id="install-list"></ul></section>
        </div>
    </main>
    <script>
        const HELP_TRANSLATIONS = {
            es: { pageTitle:"Ayuda | CourseMap Planner", badge:"Ayuda", languageLabel:"Idioma", openApp:"Abrir aplicación", heroTitle:"Ayuda de CourseMap Planner", heroLead:"CourseMap Planner es una herramienta para docentes que organiza asignaturas, unidades y actividades a lo largo del calendario escolar, teniendo en cuenta el horario semanal y los festivos.", quickStartTitle:"Primeros pasos", quickStartItems:["Crea una asignatura nueva desde la pantalla principal.","Indica el nombre de la asignatura, la fecha de inicio y las sesiones semanales.","Añade unidades didácticas o cambia al modo por actividades si necesitas más detalle.","Revisa el calendario para comprobar cómo se reparte el contenido."], planningTitle:"Modos de planificación", planningIntro:"La aplicación permite trabajar con dos niveles de detalle.", planningUnitTitle:"Por Unidades", planningUnitBody:"Define sesiones base y extra para cada unidad. Es la opción más rápida para una planificación general del curso.", planningActivityTitle:"Por Actividades", planningActivityBody:"Desglosa cada unidad en actividades concretas. Es útil cuando necesitas saber qué harás en cada sesión.", holidaysTitle:"Festivos y calendario", holidaysBody:"Activa el modo de festivos para marcar días no lectivos directamente sobre el calendario. También puedes exportar e importar listas de festivos en JSON para reutilizarlas entre asignaturas.", dataTitle:"Guardado y datos", dataBody:"La información se guarda automáticamente en el navegador mediante localStorage. Si quieres mover una planificación a otro equipo o navegador, exporta la asignatura como JSON e impórtala después.", actionsTitle:"Acciones disponibles", actionsItems:["Importar y exportar asignaturas completas en JSON.","Exportar e importar festivos por separado.","Generar un resumen imprimible de la planificación.","Cambiar el idioma de la interfaz desde el selector superior."], installTitle:"Instalación como app", installBody:"CourseMap Planner puede instalarse como PWA cuando se sirve desde localhost o HTTPS. Si el navegador la considera instalable, aparecerá el botón de instalación dentro de la app.", installItems:["Abre la aplicación desde localhost o una URL HTTPS.","Espera a que el navegador detecte que la app es instalable.","Pulsa el botón de instalar en la pantalla principal o en la vista de detalle."] },
            gl: { pageTitle:"Axuda | CourseMap Planner", badge:"Axuda", languageLabel:"Idioma", openApp:"Abrir aplicación", heroTitle:"Axuda de CourseMap Planner", heroLead:"CourseMap Planner é unha ferramenta para docentes que organiza materias, unidades e actividades ao longo do calendario escolar, tendo en conta o horario semanal e os festivos.", quickStartTitle:"Primeiros pasos", quickStartItems:["Crea unha materia nova desde a pantalla principal.","Indica o nome da materia, a data de inicio e as sesións semanais.","Engade unidades didácticas ou cambia ao modo por actividades se precisas máis detalle.","Revisa o calendario para comprobar como se reparte o contido."], planningTitle:"Modos de planificación", planningIntro:"A aplicación permite traballar con dous niveis de detalle.", planningUnitTitle:"Por Unidades", planningUnitBody:"Define sesións base e extra para cada unidade. É a opción máis rápida para unha planificación xeral do curso.", planningActivityTitle:"Por Actividades", planningActivityBody:"Desagrega cada unidade en actividades concretas. É útil cando precisas saber que farás en cada sesión.", holidaysTitle:"Festivos e calendario", holidaysBody:"Activa o modo de festivos para marcar días non lectivos directamente sobre o calendario. Tamén podes exportar e importar listas de festivos en JSON para reutilizalas entre materias.", dataTitle:"Gardado e datos", dataBody:"A información gárdase automaticamente no navegador mediante localStorage. Se queres mover unha planificación a outro equipo ou navegador, exporta a materia como JSON e impórtaa despois.", actionsTitle:"Accións dispoñibles", actionsItems:["Importar e exportar materias completas en JSON.","Exportar e importar festivos por separado.","Xerar un resumo imprimible da planificación.","Cambiar o idioma da interface desde o selector superior."], installTitle:"Instalación como app", installBody:"CourseMap Planner pode instalarse como PWA cando se serve desde localhost ou HTTPS. Se o navegador a considera instalable, aparecerá o botón de instalación dentro da app.", installItems:["Abre a aplicación desde localhost ou unha URL HTTPS.","Espera a que o navegador detecte que a app é instalable.","Preme o botón de instalar na pantalla principal ou na vista de detalle."] },
            ca: { pageTitle:"Ajuda | CourseMap Planner", badge:"Ajuda", languageLabel:"Idioma", openApp:"Obrir aplicació", heroTitle:"Ajuda de CourseMap Planner", heroLead:"CourseMap Planner és una eina per a docents que organitza assignatures, unitats i activitats al llarg del calendari escolar, tenint en compte l'horari setmanal i els festius.", quickStartTitle:"Primers passos", quickStartItems:["Crea una assignatura nova des de la pantalla principal.","Indica el nom de l'assignatura, la data d'inici i les sessions setmanals.","Afegeix unitats didàctiques o canvia al mode per activitats si necessites més detall.","Revisa el calendari per comprovar com es reparteix el contingut."], planningTitle:"Modes de planificació", planningIntro:"L'aplicació permet treballar amb dos nivells de detall.", planningUnitTitle:"Per Unitats", planningUnitBody:"Defineix sessions base i extra per a cada unitat. És l'opció més ràpida per a una planificació general del curs.", planningActivityTitle:"Per Activitats", planningActivityBody:"Desglossa cada unitat en activitats concretes. És útil quan necessites saber què faràs a cada sessió.", holidaysTitle:"Festius i calendari", holidaysBody:"Activa el mode de festius per marcar dies no lectius directament sobre el calendari. També pots exportar i importar llistes de festius en JSON per reutilitzar-les entre assignatures.", dataTitle:"Desat i dades", dataBody:"La informació es desa automàticament al navegador mitjançant localStorage. Si vols moure una planificació a un altre equip o navegador, exporta l'assignatura com a JSON i importa-la després.", actionsTitle:"Accions disponibles", actionsItems:["Importar i exportar assignatures completes en JSON.","Exportar i importar festius per separat.","Generar un resum imprimible de la planificació.","Canviar l'idioma de la interfície des del selector superior."], installTitle:"Instal·lació com a app", installBody:"CourseMap Planner es pot instal·lar com a PWA quan se serveix des de localhost o HTTPS. Si el navegador la considera instal·lable, apareixerà el botó d'instal·lació dins de l'app.", installItems:["Obre l'aplicació des de localhost o una URL HTTPS.","Espera que el navegador detecti que l'app és instal·lable.","Prem el botó d'instal·lar a la pantalla principal o a la vista de detall."] },
            eu: { pageTitle:"Laguntza | CourseMap Planner", badge:"Laguntza", languageLabel:"Hizkuntza", openApp:"Ireki aplikazioa", heroTitle:"CourseMap Planner laguntza", heroLead:"CourseMap Planner irakasleentzako tresna bat da, irakasgaiak, unitateak eta jarduerak eskola-egutegian antolatzeko, asteko ordutegia eta jaiegunak kontuan hartuta.", quickStartTitle:"Lehen urratsak", quickStartItems:["Sortu irakasgai berri bat hasierako pantailatik.","Adierazi irakasgaiaren izena, hasiera-data eta asteko saioak.","Gehitu unitate didaktikoak edo aldatu jardueren modura xehetasun gehiago behar baduzu.","Begiratu egutegia edukia nola banatzen den egiaztatzeko."], planningTitle:"Plangintza moduak", planningIntro:"Aplikazioak bi xehetasun-mailarekin lan egiteko aukera ematen du.", planningUnitTitle:"Unitateen arabera", planningUnitBody:"Zehaztu unitate bakoitzeko oinarrizko eta aparteko saioak. Ikasturtearen plangintza orokorrerako aukerarik azkarrena da.", planningActivityTitle:"Jardueren arabera", planningActivityBody:"Unitate bakoitza jarduera zehatzetan banatzen du. Saio bakoitzean zer egingo duzun jakin behar duzunean erabilgarria da.", holidaysTitle:"Jaiegunak eta egutegia", holidaysBody:"Aktibatu jaiegun modua eskola-egutegian bertan egun ez-eskolarik markatzeko. Jaiegun-zerrendak JSON formatuan esportatu eta inportatu ere egin ditzakezu irakasgaien artean berrerabiltzeko.", dataTitle:"Gordetzea eta datuak", dataBody:"Informazioa automatikoki gordetzen da nabigatzailean localStorage erabiliz. Plangintza beste ordenagailu edo nabigatzaile batera eraman nahi baduzu, esportatu irakasgaia JSON gisa eta gero inportatu.", actionsTitle:"Eskuragarri dauden ekintzak", actionsItems:["Irakasgai osoak JSON formatuan inportatu eta esportatu.","Jaiegunak aparte esportatu eta inportatu.","Plangintzaren laburpen inprimagarria sortu.","Interfazearen hizkuntza goiko hautatzailetik aldatu."], installTitle:"App gisa instalatzea", installBody:"CourseMap Planner PWA gisa instala daiteke localhost edo HTTPS bidez zerbitzatzen denean. Nabigatzaileak instalagarritzat jotzen badu, instalazio-botoia agertuko da app barruan.", installItems:["Ireki aplikazioa localhost edo HTTPS URL batetik.","Itxaron nabigatzaileak app-a instalagarri dela antzeman arte.","Sakatu instalatzeko botoia hasierako pantailan edo xehetasun bistatik."] },
            en: { pageTitle:"Help | CourseMap Planner", badge:"Help", languageLabel:"Language", openApp:"Open app", heroTitle:"CourseMap Planner Help", heroLead:"CourseMap Planner is a tool for teachers that organizes subjects, units, and activities across the school calendar while taking the weekly timetable and holidays into account.", quickStartTitle:"Getting started", quickStartItems:["Create a new subject from the main screen.","Set the subject name, the start date, and the weekly sessions.","Add teaching units or switch to activity mode if you need more detail.","Review the calendar to see how the content is distributed."], planningTitle:"Planning modes", planningIntro:"The application supports two levels of detail.", planningUnitTitle:"By Units", planningUnitBody:"Define base and extra sessions for each unit. It is the fastest option for a general yearly plan.", planningActivityTitle:"By Activities", planningActivityBody:"Break each unit into specific activities. It is useful when you need to know exactly what happens in each session.", holidaysTitle:"Holidays and calendar", holidaysBody:"Enable holiday mode to mark non-teaching days directly on the calendar. You can also export and import holiday lists as JSON to reuse them across subjects.", dataTitle:"Saving and data", dataBody:"Information is saved automatically in the browser using localStorage. If you want to move a plan to another device or browser, export the subject as JSON and import it there.", actionsTitle:"Available actions", actionsItems:["Import and export full subjects as JSON.","Export and import holidays separately.","Generate a printable planning summary.","Change the interface language from the top selector."], installTitle:"Install as an app", installBody:"CourseMap Planner can be installed as a PWA when it is served from localhost or HTTPS. If the browser considers it installable, the install button will appear inside the app.", installItems:["Open the app from localhost or an HTTPS URL.","Wait for the browser to detect that the app is installable.","Click the install button on the main screen or in the detail view."] },
            fr: { pageTitle:"Aide | CourseMap Planner", badge:"Aide", languageLabel:"Langue", openApp:"Ouvrir l'application", heroTitle:"Aide de CourseMap Planner", heroLead:"CourseMap Planner est un outil pour les enseignants qui organise les matières, les unités et les activités tout au long du calendrier scolaire en tenant compte de l'emploi du temps hebdomadaire et des jours fériés.", quickStartTitle:"Premiers pas", quickStartItems:["Créez une nouvelle matière depuis l'écran principal.","Indiquez le nom de la matière, la date de début et les séances hebdomadaires.","Ajoutez des unités didactiques ou passez au mode par activités si vous avez besoin de plus de détail.","Consultez le calendrier pour voir comment le contenu est réparti."], planningTitle:"Modes de planification", planningIntro:"L'application prend en charge deux niveaux de détail.", planningUnitTitle:"Par unités", planningUnitBody:"Définissez les séances de base et supplémentaires pour chaque unité. C'est l'option la plus rapide pour une planification générale de l'année.", planningActivityTitle:"Par activités", planningActivityBody:"Découpez chaque unité en activités précises. C'est utile lorsque vous devez savoir exactement ce qui se passe à chaque séance.", holidaysTitle:"Jours fériés et calendrier", holidaysBody:"Activez le mode jours fériés pour marquer directement sur le calendrier les jours non ouvrés. Vous pouvez aussi exporter et importer des listes de jours fériés au format JSON pour les réutiliser entre les matières.", dataTitle:"Enregistrement et données", dataBody:"Les informations sont enregistrées automatiquement dans le navigateur via localStorage. Si vous souhaitez déplacer un plan vers un autre appareil ou navigateur, exportez la matière au format JSON puis importez-la.", actionsTitle:"Actions disponibles", actionsItems:["Importer et exporter des matières complètes en JSON.","Exporter et importer les jours fériés séparément.","Générer un résumé imprimable de la planification.","Changer la langue de l'interface depuis le sélecteur supérieur."], installTitle:"Installer comme application", installBody:"CourseMap Planner peut être installé comme PWA lorsqu'il est servi depuis localhost ou HTTPS. Si le navigateur le considère comme installable, le bouton d'installation apparaîtra dans l'application.", installItems:["Ouvrez l'application depuis localhost ou une URL HTTPS.","Attendez que le navigateur détecte que l'application est installable.","Cliquez sur le bouton d'installation sur l'écran principal ou dans la vue de détail."] },
            de: { pageTitle:"Hilfe | CourseMap Planner", badge:"Hilfe", languageLabel:"Sprache", openApp:"App öffnen", heroTitle:"Hilfe zu CourseMap Planner", heroLead:"CourseMap Planner ist ein Werkzeug für Lehrkräfte, das Fächer, Einheiten und Aktivitäten über den Schulkalender hinweg organisiert und dabei den Wochenplan sowie Feiertage berücksichtigt.", quickStartTitle:"Erste Schritte", quickStartItems:["Erstelle auf dem Hauptbildschirm ein neues Fach.","Lege den Namen des Fachs, das Startdatum und die wöchentlichen Sitzungen fest.","Füge didaktische Einheiten hinzu oder wechsle in den Aktivitätsmodus, wenn du mehr Detail benötigst.","Prüfe den Kalender, um zu sehen, wie die Inhalte verteilt werden."], planningTitle:"Planungsmodi", planningIntro:"Die Anwendung unterstützt zwei Detailstufen.", planningUnitTitle:"Nach Einheiten", planningUnitBody:"Definiere Basis- und Zusatzsitzungen für jede Einheit. Das ist die schnellste Option für eine allgemeine Jahresplanung.", planningActivityTitle:"Nach Aktivitäten", planningActivityBody:"Unterteile jede Einheit in konkrete Aktivitäten. Das ist hilfreich, wenn du genau wissen musst, was in jeder Sitzung passiert.", holidaysTitle:"Feiertage und Kalender", holidaysBody:"Aktiviere den Feiertagsmodus, um unterrichtsfreie Tage direkt im Kalender zu markieren. Du kannst Feiertagslisten auch als JSON exportieren und importieren, um sie fachübergreifend wiederzuverwenden.", dataTitle:"Speichern und Daten", dataBody:"Die Informationen werden mithilfe von localStorage automatisch im Browser gespeichert. Wenn du einen Plan auf ein anderes Gerät oder in einen anderen Browser übertragen möchtest, exportiere das Fach als JSON und importiere es dort.", actionsTitle:"Verfügbare Aktionen", actionsItems:["Vollständige Fächer als JSON importieren und exportieren.","Feiertage separat exportieren und importieren.","Eine druckbare Planungszusammenfassung erzeugen.","Die Sprache der Oberfläche über den oberen Auswahlbereich ändern."], installTitle:"Als App installieren", installBody:"CourseMap Planner kann als PWA installiert werden, wenn er über localhost oder HTTPS bereitgestellt wird. Wenn der Browser ihn als installierbar erkennt, erscheint die Installationsschaltfläche in der App.", installItems:["Öffne die App über localhost oder eine HTTPS-URL.","Warte, bis der Browser erkennt, dass die App installierbar ist.","Klicke auf die Installationsschaltfläche auf dem Hauptbildschirm oder in der Detailansicht."] },
            pt: { pageTitle:"Ajuda | CourseMap Planner", badge:"Ajuda", languageLabel:"Idioma", openApp:"Abrir app", heroTitle:"Ajuda do CourseMap Planner", heroLead:"CourseMap Planner é uma ferramenta para docentes que organiza disciplinas, unidades e atividades ao longo do calendário escolar, tendo em conta o horário semanal e os feriados.", quickStartTitle:"Primeiros passos", quickStartItems:["Cria uma nova disciplina a partir do ecrã principal.","Define o nome da disciplina, a data de início e as sessões semanais.","Adiciona unidades didáticas ou muda para o modo por atividades se precisares de mais detalhe.","Revê o calendário para perceber como o conteúdo é distribuído."], planningTitle:"Modos de planeamento", planningIntro:"A aplicação suporta dois níveis de detalhe.", planningUnitTitle:"Por Unidades", planningUnitBody:"Define sessões base e extra para cada unidade. É a opção mais rápida para um planeamento anual geral.", planningActivityTitle:"Por Atividades", planningActivityBody:"Divide cada unidade em atividades específicas. É útil quando precisas de saber exatamente o que acontece em cada sessão.", holidaysTitle:"Feriados e calendário", holidaysBody:"Ativa o modo de feriados para marcar dias não letivos diretamente no calendário. Também podes exportar e importar listas de feriados em JSON para reutilizá-las entre disciplinas.", dataTitle:"Gravação e dados", dataBody:"A informação é guardada automaticamente no navegador através de localStorage. Se quiseres mover um plano para outro dispositivo ou navegador, exporta a disciplina em JSON e importa-a depois.", actionsTitle:"Ações disponíveis", actionsItems:["Importar e exportar disciplinas completas em JSON.","Exportar e importar feriados separadamente.","Gerar um resumo imprimível do planeamento.","Alterar o idioma da interface no seletor superior."], installTitle:"Instalar como app", installBody:"CourseMap Planner pode ser instalado como PWA quando é servido a partir de localhost ou HTTPS. Se o navegador o considerar instalável, o botão de instalação aparecerá dentro da app.", installItems:["Abre a app a partir de localhost ou de um URL HTTPS.","Espera que o navegador detete que a app é instalável.","Clica no botão de instalar no ecrã principal ou na vista de detalhe."] }
        };

        const getLanguage = () => {
            const params = new URLSearchParams(window.location.search);
            const language = params.get('lang');
            return HELP_TRANSLATIONS[language] ? language : 'es';
        };
        const renderList = (element, items) => { element.innerHTML = items.map(item => `<li>${item}</li>`).join(''); };
        const applyHelpTranslations = language => {
            const content = HELP_TRANSLATIONS[language];
            document.documentElement.lang = language;
            document.title = content.pageTitle;
            document.getElementById('hero-badge').textContent = content.badge;
            document.getElementById('lang-label').textContent = content.languageLabel;
            document.getElementById('open-app-link').textContent = content.openApp;
            document.getElementById('hero-title').textContent = content.heroTitle;
            document.getElementById('hero-lead').textContent = content.heroLead;
            document.getElementById('quick-start-title').textContent = content.quickStartTitle;
            document.getElementById('planning-title').textContent = content.planningTitle;
            document.getElementById('planning-intro').textContent = content.planningIntro;
            document.getElementById('planning-unit-title').textContent = content.planningUnitTitle;
            document.getElementById('planning-unit-body').textContent = content.planningUnitBody;
            document.getElementById('planning-activity-title').textContent = content.planningActivityTitle;
            document.getElementById('planning-activity-body').textContent = content.planningActivityBody;
            document.getElementById('holidays-title').textContent = content.holidaysTitle;
            document.getElementById('holidays-body').textContent = content.holidaysBody;
            document.getElementById('data-title').textContent = content.dataTitle;
            document.getElementById('data-body').textContent = content.dataBody;
            document.getElementById('actions-title').textContent = content.actionsTitle;
            document.getElementById('install-title').textContent = content.installTitle;
            document.getElementById('install-body').textContent = content.installBody;
            renderList(document.getElementById('quick-start-list'), content.quickStartItems);
            renderList(document.getElementById('actions-list'), content.actionsItems);
            renderList(document.getElementById('install-list'), content.installItems);
            document.getElementById('lang-picker').value = language;
        };
        const syncLanguage = language => {
            const url = new URL(window.location.href);
            url.searchParams.set('lang', language);
            window.history.replaceState({}, '', url);
            applyHelpTranslations(language);
        };
        document.getElementById('lang-picker').addEventListener('change', event => { syncLanguage(event.target.value); });
        document.getElementById('open-app-link').addEventListener('click', () => { localStorage.setItem('planificador_lang', document.getElementById('lang-picker').value); });
        syncLanguage(getLanguage());
    </script>
</body>
</html>
